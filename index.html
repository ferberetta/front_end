            <h1>Historia del One Piece</h1>
        
            <p>  
            <li><h2>Quién es Gol D. Roger.</h2></li>                            
                <h4>Gol D. Roger, mejor conocido como Gold Roger, fue el legendario Rey de los Piratas y 
                capitán de los Piratas de Roger. Fue el único en conquistar la Grand Line y encontrar 
                el gran tesoro, el One Piece. Sus últimas palabras antes de morir dieron inicio a 
                la Gran Era de la Piratería
                </h4>
            </p>
            <br>
                <li><h2>Qué ocurrió con su ejecución.</h2></li>
                <h4>
                    Se entregó a la Marina por una enfermedad incurable; su muerte en Loguetown
                    inspiró a millones a buscar el mar.
                </h4>
                <br>
            <p>
                <li><h2>Qué es el One Piece.</h2></li>
                <h4> One Piece es el nombre del legendario y valioso tesoro dejado por el difunto Rey de los
                Piratas, Gol D. Roger, en la última isla del mundo (Laugh Tale), y es también el título
                del famoso manga y anime creado por Eiichirō Oda que narra la búsqueda de este objeto
                por parte de Monkey D. Luffy.
                </h4>
            </p>
            <br>
            <p>
                <li><h2>Información sobre la Gran Era Pirata.</h2></li>
                <h4>
                    en One Piece es el periodo histórico que comienza tras la ejecución pública del 
                    Rey de los Piratas, Gol D. Roger. Con sus últimas palabras, Roger reveló la
                    existencia de su gran tesoro, el One Piece, inspirando a miles de personas a 
                    lanzarse al mar.
                </h4>
            </p>
            </ul>

                        <h3>Grand Line</h3>
                        <p>El Grand Line (o Gran Ruta Marítima) es el Océano principal en el anime y manga One Piece. Es una franja de mar considerada
                         la más peligrosa del mundo y el "cementerio de piratas", donde las brújulas normales no sirven debido a campos magnéticos y
